name: oncuidar
description: "Apoyo al cuidado oncológico pediátrico"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ──
  firebase_core: 4.12.0
  firebase_auth: 6.5.4
  cloud_firestore: 6.6.0
  firebase_messaging: 16.4.1
  firebase_storage: 13.4.4

  # ── Diseño ──
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.0
  cupertino_icons: ^1.0.8

  # ── State Management ──
  flutter_riverpod: ^3.3.2

  # ── Navegación ──
  go_router: ^17.3.0

  # ── Notificaciones ──
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0

  # ── Utilidades ──
  intl: ^0.20.0
  url_launcher: ^6.3.0
  open_filex: ^4.7.0
  excel: ^4.0.6
  pdf: ^3.12.0
  shared_preferences: ^2.3.0
  uuid: ^4.5.0

  # ── Offline / Cache ──
  flutter_cache_manager: ^3.4.1
  video_player: ^2.9.3
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^4.1.1
  firebase_auth_mocks: ^0.15.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/LogoOncuidar.png"
  adaptive_icon_background: "#FDF8ED"
  adaptive_icon_foreground: "assets/images/LogoOncuidar.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
